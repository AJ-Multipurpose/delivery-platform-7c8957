[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
[images]
remote_images = ["https://images.unsplash.com/.*"]
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), camera=(self)"
